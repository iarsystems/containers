name: riscv-linux

on:
  # Workflow dispatched manually
  workflow_dispatch:
  # Workflow runs automatically after `riscv-windows`
  workflow_run:
    workflows: [ "riscv-windows" ]
    types: [ completed ]

permissions:
  contents: read
  packages: write

jobs:
  # Generate the -full image with the IAR Build tools for RISC-V.
  # It includes: -minimal, `cspybat`, `iarbuild` and `cstat`,
  # and all vendor-specific device support
  riscv-full:
    strategy:
      matrix:
        version:
        - 3.40.1
        - 3.40.2
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-riscv.full
        build-args: |
          VERSION=${{ matrix.version }}
          REGISTRY_REPO=ghcr.io/${{ github.repository_owner }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.version }}-linux-full
  # Regenerate the Docker manifest so that we get the multi-arch image
  riscv-multi-arch:
    needs: [ riscv-full ]
    strategy:
      matrix:
        version:
        - 3.40.1
        - 3.40.2
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-24.04
    steps:
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push the multi-architecture manifest
      run: |
        docker manifest create ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.version }} \
          ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.version }}-linux-full \
          ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.version }}-windows-2022-full \
          ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.version }}-windows-2025-full
        docker manifest push ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.version }}     
    - name: Push latest
      if: matrix.version == '3.40.2'
      run: |
        docker manifest create ghcr.io/${{ github.repository_owner }}/riscv:latest \
          ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.version }}-linux-full \
          ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.version }}-windows-2022-full \
          ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.version }}-windows-2025-full
        docker manifest push ghcr.io/${{ github.repository_owner }}/riscv:latest