name: riscv-linux

on:
  # Workflow dispatched manually
  workflow_dispatch:
  # Workflow runs automatically after `riscv-windows`
  workflow_run:
    workflows: [ "riscv-windows" ]
    types: [ completed ]

permissions:
  contents: read
  packages: write

jobs:
  # Generate the -full image with the IAR Build tools for RISC-V.
  # It includes: -minimal, `cspybat`, `iarbuild` and `cstat`,
  # and all vendor-specific device support
  riscv-full:
    strategy:
      matrix:
        cfg:
        - { version: 3.40.2 }
        - { version: 3.40.1 }
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-riscv.full
        build-args: |
          VERSION=${{ matrix.cfg.version }}
          REGISTRY_REPO=ghcr.io/${{ github.repository_owner }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/riscv:${{ matrix.cfg.version }}-linux-full

  # Regenerate the Docker manifest so that we get the multi-arch image
  riscv-multi-arch:
    needs: [ riscv-full ]
    strategy:
      matrix:
        version: [ 3.40.2, 3.40.1 ]
        registry-repo: [ "ghcr.io/${{ github.repository_owner }}" ]
    runs-on: ubuntu-24.04
    steps:
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        docker manifest create ${{ matrix.registry-repo }}/riscv:${{ matrix.version }} \
          ${{ matrix.registry-repo }}/riscv:${{ matrix.version }}-linux-full \
          ${{ matrix.registry-repo }}/riscv:${{ matrix.version }}-windows-2022-full \
          ${{ matrix.registry-repo }}/riscv:${{ matrix.version }}-windows-2025-full
    - name: Push the manifest
      run: |
        docker manifest push ${{ matrix.registry-repo }}/riscv:${{ matrix.version }}     

# Finalize manifest        
  riscv-manifest-finalize:
    needs: [ riscv-multi-arch ] 
    strategy:
      matrix:
        target: [  riscv ]
        latest: [ 3.40.2 ]
        registry-repo: [ "ghcr.io/${{ github.repository_owner }}" ]
    runs-on: ubuntu-24.04
    steps:
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Regenerate manifest for latest
      run: |
        docker manifest create ${{ matrix.registry-repo }}/riscv:latest \
          ${{ matrix.registry-repo }}/riscv:${{ matrix.latest }}-linux-full \
          ${{ matrix.registry-repo }}/riscv:${{ matrix.latest }}-windows-2022-full \
          ${{ matrix.registry-repo }}/riscv:${{ matrix.latest }}-windows-2025-full
    - name: Push the manifest
      run: |
        docker manifest push ${{ matrix.registry-repo }}/riscv:latest