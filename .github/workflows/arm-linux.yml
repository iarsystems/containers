name: arm-linux

on:
  # Workflow dispatched manually
  workflow_dispatch:
  # Workflow runs automatically after `arm-windows`
  workflow_run:
    workflows: [ "arm-windows" ]
    types: [ completed ]

permissions:
  contents: read
  packages: write

jobs:
  # The -minimal image can be fetched faster for simple tasks
  minimal:
    strategy:
      matrix:
        version:
        - 9.60.4
        - 9.70.1
        - 9.70.2
        - 9.70.4
        - 10.10.2
      fail-fast: false
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-arm.minimal
        build-args: |
          VERSION=${{ matrix.version }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-linux-minimal
  # Generate the -base image with the IAR Build tools for Arm.
  # It includes: -minimal, `cspybat`, `iarbuild` and `cstat`.
  # It does not include: vendor-specific device support
  base:
    needs: [ minimal ]
    strategy:
      matrix:
        version:
        - 9.60.4
        - 9.70.1
        - 9.70.2
        - 9.70.4
        - 10.10.2
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-arm.base
        build-args: |
          VERSION=${{ matrix.version }}
          REGISTRY_REPO=ghcr.io/${{ github.repository_owner }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-linux-base
            
  # Generate variant images with the IAR Build Tools for Arm
  # *including* vendor-specific device support
  device:
    needs: [ base ]
    strategy:
      matrix:
        version:
        - 9.60.4
        - 9.70.1
        - 9.70.2
        - 9.70.4
        - 10.10.2
        variant:
        - additional
        - infineon
        - microchip
        - nxp
        - renesas
        - st
        - ti
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-arm.device
        build-args: |
          VERSION=${{ matrix.version }}
          VARIANT=${{ matrix.variant }}
          REGISTRY_REPO=ghcr.io/${{ github.repository_owner }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-linux-${{ matrix.variant }}

  # Regenerate the Docker manifest so that we get the multi-arch image
  multi-arch:
    needs: [ device ]
    strategy:
      matrix:
        version:
        - 9.60.4
        - 9.70.1
        - 9.70.2
        - 9.70.4
        - 10.10.2
        variant:
        - additional
        - microchip
        - renesas
        - nxp
        - infineon
        - st
        - ti
        - minimal
        - base
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-24.04
    steps:
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push the multi-architecture manifest
      run: |
        docker manifest create ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-${{ matrix.variant }} \
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-linux-${{ matrix.variant }} \
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-windows-2022-${{ matrix.variant }} \
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-windows-2025-${{ matrix.variant }}
        docker manifest push ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-${{ matrix.variant }}
    - name: Push latest
      if: matrix.variant == 'base' && matrix.version == '10.10.2'
      run: |
        docker manifest create ghcr.io/${{ github.repository_owner }}/arm:latest \
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-linux-base \
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-windows-2022-base \
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-windows-2025-base
        docker manifest push ghcr.io/${{ github.repository_owner }}/arm:latest