name: rl78-windows

on:
  # Workflow dispatched manually
  workflow_dispatch:
  # Workflow under a monthly schedule
  schedule:
  - cron: '30 0 1 * *'

permissions:
  contents: read
  packages: write

jobs:
  # Generate the -full image with the IAR Build tools for Renesas RL78
  rl78-full:
    strategy:
      matrix:
        cfg:
        - { version: 5.20.2 }
        - { version: 5.20.1 }
        os: [ 2022, 2025 ]
    runs-on: windows-${{ matrix.os }}
    steps:
    # https://github.com/actions/runner-images/issues/13729
    - name: Ensure Docker is running (Windows)
      shell: pwsh
      run: |
        Start-Service docker
        for ($i = 0; $i -lt 30; $i++) {
          docker info *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          Start-Sleep 2
        }
        docker info
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - if: github.event_name != 'pull_request'
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.cfg.version }}-windows-${{ matrix.os }}-full `
          -f .github/workflows/windows/Dockerfile-rl78.full `
          --build-arg VERSION=${{ matrix.cfg.version }} `
          --build-arg WINVER=${{ matrix.os }} `
          .github/workflows/windows;
        docker push ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.cfg.version }}-windows-${{ matrix.os }}-full;
      shell: pwsh