name: arm-10.10.2-linux

on:
  # Workflow dispatched manually
  workflow_dispatch:
  # Workflow runs automatically after `arm-10.10.2-windows`
  workflow_run:
    workflows: [ "arm-10.10.2-windows" ]
    types: [ completed ]

permissions:
  contents: read
  packages: write

jobs:
  # The -minimal image can be fetched faster for simple tasks
  minimal:
    strategy:
      matrix:
        cfg:
        - { version: 10.10.2 }
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-arm-${{ matrix.cfg.version }}.minimal
        build-args: |
          VERSION=${{ matrix.cfg.version }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.cfg.version }}-linux-minimal

  # Generate the -base image with the IAR Build tools for Arm.
  # It includes: -minimal, `cspybat`, `iarbuild` and `cstat`.
  # It does not include: vendor-specific device support
  base:
    needs: [ minimal ]
    strategy:
      matrix:
        version: [ 10.10.2 ]
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-arm-${{ matrix.version }}.base
        build-args: |
          VERSION=${{ matrix.version }}
          REGISTRY_REPO=ghcr.io/${{ github.repository_owner }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.version }}-linux-base
            
  # Generate variant images with the IAR Build Tools for Arm
  # *including* vendor-specific device support
  device:
    needs: [ base ]
    strategy:
      matrix:
        cfg:
        - { version: 10.10.2 }
        variant:
        - additional
        - microchip
        - renesas
        - nxp
        - infineon
        - st
        - ti
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-arm-${{ matrix.cfg.version }}.device
        build-args: |
          VERSION=${{ matrix.cfg.version }}
          VARIANT=${{ matrix.variant }}
          REGISTRY_REPO=ghcr.io/${{ github.repository_owner }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ github.repository_owner }}/arm:${{ matrix.cfg.version }}-linux-${{ matrix.variant }}

  # Regenerate the Docker manifest so that we get the multi-arch image
  multi-arch:
    needs: [ device ]
    strategy:
      matrix:
        version: [ 10.10.2 ]
        registry-repo: [ "ghcr.io/${{ github.repository_owner }}" ]
        variant:
        - minimal
        - base
        - additional
        - microchip
        - renesas
        - nxp
        - infineon
        - st
        - ti
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        docker manifest create ${{ matrix.registry-repo }}/arm:${{ matrix.version }}-${{ matrix.variant }} \
          ${{ matrix.registry-repo }}/arm:${{ matrix.version }}-linux-${{ matrix.variant }} \
          ${{ matrix.registry-repo }}/arm:${{ matrix.version }}-windows-2022-${{ matrix.variant }} \
          ${{ matrix.registry-repo }}/arm:${{ matrix.version }}-windows-2025-${{ matrix.variant }}
    - name: Push the manifest
      run: |
        docker manifest push ${{ matrix.registry-repo }}/arm:${{ matrix.version }}-${{ matrix.variant }}

  # Finalize manifest        
  finalize:
    needs: [ multi-arch ] 
    strategy:
      matrix:
        latest: [ 10.10.2 ]
        registry-repo: [ "ghcr.io/${{ github.repository_owner }}" ]
      fail-fast: false
    runs-on: ubuntu-24.04
    steps:
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Regenerate manifest for latest
      run: |
        docker manifest create ${{ matrix.registry-repo }}/arm:latest \
          ${{ matrix.registry-repo }}/arm:${{ matrix.latest }}-linux-base \
          ${{ matrix.registry-repo }}/arm:${{ matrix.latest }}-windows-2022-base \
          ${{ matrix.registry-repo }}/arm:${{ matrix.latest }}-windows-2025-base
    - name: Push the manifest
      run: |
        docker manifest push ${{ matrix.registry-repo }}/arm:latest
