name: rl78-linux

on:
  # Workflow dispatched manually
  workflow_dispatch:
  # Workflow runs automatically after `rl78-windows`
  workflow_run:
    workflows: [ "rl78-windows" ]
    types: [ completed ]

permissions:
  contents: read
  packages: write

jobs:
  # Generate the -full image with the IAR Build tools for Renesas RL78.
  rl78-full:
    strategy:
      matrix:
        cfg:
        - { version: 5.20.2 }
        - { version: 5.20.1 }
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-rl78.full
        build-args: |
          VERSION=${{ matrix.cfg.version }}
          REGISTRY_REPO=ghcr.io/${{ github.repository_owner }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.cfg.version }}-linux-full

  # Regenerate the Docker manifest so that we get the multi-arch image
  rl78-multi-arch:
    needs: [ rl78-full ]
    strategy:
      matrix:
        version: [ 5.20.2 ]
        latest: [ 5.20.2 ]
        registry-repo: [ "ghcr.io/${{ github.repository_owner }}" ]
    runs-on: ubuntu-24.04
    steps:
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - run: |
        docker manifest create ${{ matrix.registry-repo }}/rl78:${{ matrix.version }} \
          ${{ matrix.registry-repo }}/rl78:${{ matrix.version }}-linux-full \
          ${{ matrix.registry-repo }}/rl78:${{ matrix.version }}-windows-2022-full \
          ${{ matrix.registry-repo }}/rl78:${{ matrix.version }}-windows-2025-full
    - name: Push the manifest
      run: |
        docker manifest push ${{ matrix.registry-repo }}/rl78:${{ matrix.version }}
    - name: Finalize Manifest (latest)
      run: |
        docker manifest create ${{ matrix.registry-repo }}/rl78:latest \
          ${{ matrix.registry-repo }}/rl78:${{ matrix.latest }}-linux-full \
          ${{ matrix.registry-repo }}/rl78:${{ matrix.version }}-windows-2022-full \
          ${{ matrix.registry-repo }}/rl78:${{ matrix.version }}-windows-2025-full
    - name: Push the manifest (latest)
      run: |
        docker manifest push ${{ matrix.registry-repo }}/rl78:latest          
