name: rl78-linux

on:
  # Workflow dispatched manually
  workflow_dispatch:
  # Workflow runs automatically after `rl78-windows`
  workflow_run:
    workflows: [ "rl78-windows" ]
    types: [ completed ]

permissions:
  contents: read
  packages: write

jobs:
  # Generate the -full image with the IAR Build tools for Renesas RL78.
  rl78-full:
    strategy:
      matrix:
        version:
        - 5.20.1
        - 5.20.2
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@main
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v7
      with:
        file: ./.github/workflows/linux/Dockerfile-rl78.full
        build-args: |
          VERSION=${{ matrix.version }}
          REGISTRY_REPO=ghcr.io/${{ github.repository_owner }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.version }}-linux-full
  # Regenerate the Docker manifest so that we get the multi-arch image
  rl78-multi-arch:
    needs: [ rl78-full ]
    strategy:
      matrix:
        version:
        - 5.20.1
        - 5.20.2
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-24.04
    steps:
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push the multi-architecture manifest
      run: |
        docker manifest create ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.version }} \
          ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.version }}-linux-full \
          ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.version }}-windows-2022-full \
          ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.version }}-windows-2025-full
        docker manifest push ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.version }}
    - name: Push latest
      if: matrix.version == '5.20.2'
      run: |
        docker manifest create ghcr.io/${{ github.repository_owner }}/rl78:latest \
          ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.version }}-linux-full \
          ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.version }}-windows-2022-full \
          ghcr.io/${{ github.repository_owner }}/rl78:${{ matrix.version }}-windows-2025-full
        docker manifest push ghcr.io/${{ github.repository_owner }}/rl78:latest
